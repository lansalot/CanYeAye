name: Build & Release

# Releases are cut by pushing a tag, for example:
#   git tag v0.1.3
#   git push origin v0.1.3
# Branch pushes and pull requests do not build anything.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration $env:CONFIGURATION --no-restore

      - name: Test
        run: dotnet test --configuration $env:CONFIGURATION --no-build --nologo -v q

  publish:
    name: Publish ${{ matrix.rid }}
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version from tag $GITHUB_REF_NAME"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish
        run: >
          dotnet publish src/WinCAN.App/WinCAN.App.csproj
          --configuration ${{ env.CONFIGURATION }}
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          --output publish

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath dist/wincan-${{ matrix.rid }}.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          staging="$(mktemp -d)"
          mkdir -p "$staging/wincan-${{ matrix.rid }}"
          cp -a publish/. "$staging/wincan-${{ matrix.rid }}/"
          mkdir -p dist
          tar -czf "dist/wincan-${{ matrix.rid }}.tar.gz" -C "$staging" "wincan-${{ matrix.rid }}"
          rm -rf "$staging"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: wincan-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Re-run of the same tag: replace the packages instead of failing.
            gh release upload "$TAG" dist/*.zip dist/*.tar.gz --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/*.zip dist/*.tar.gz \
              --verify-tag \
              --repo "$REPO" \
              --title "WinCAN $TAG" \
              --generate-notes
          fi
